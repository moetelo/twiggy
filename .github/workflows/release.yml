name: Publish

on:
  workflow_dispatch: ~
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
  OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .github/.bun-version

      - run: bun ci

      - run: bun run build

      - run: bunx @vscode/vsce publish --no-dependencies
        working-directory: ./packages/vscode

      - run: bunx ovsx publish --no-dependencies
        working-directory: ./packages/vscode

      # Trusted publishing needs npm >= 11.5.1; bun publish has no OIDC support.
      # bun pm pack still does the packing so catalog: versions get resolved.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@^11.5.1

      # https://github.com/oven-sh/bun/issues/15601#issuecomment-3058486500
      - name: npm publish language-server
        working-directory: ./packages/language-server
        run: |
          bun pm pack --destination "$RUNNER_TEMP" --quiet
          npm publish "$RUNNER_TEMP"/twiggy-language-server-*.tgz --access public

  github-release:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{f = index($0, "## " v " ") == 1; next} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
